<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-react</title>
     <link rel="stylesheet" href="../frontend/css/connection.css">
  </head>
 <body>
    <div class="login-container">
        <h2>Connexion projet </h2>
      
        
        <form onsubmit="login(event)"> 
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Safe-T-wrist@gmail.com" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="********" required>

            <p id="message"></p> 

            <button type="submit" class="btn-connexion">Connexion</button>
        </form>
        <p class="register-link">Pas encore inscrit ? <a href="../frontend-react/dashboard.html">Crée ton compte</a></p>
    </div>

    <script src="../frontend-react/src/login.jsx"></script>
</body>
</html>
