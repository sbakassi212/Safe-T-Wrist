<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="../css/connection.css">
</head>
<body>
    <div class="login-container">
        <h2>Connexion</h2>
       <form id="authForm">
            <label for="nom d'utilisateur">Nom d'utilisateur</label> 
            <input type="text" id="username" name="username" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

          <p id="message"></p> 

     <button type="button" class="btn-connexion" onclick="login(event)">Se connecter</button>
        </form>
        <p class="register-link">Pas encore de compte ? <a href="../html/inscription.html">Inscrivez-vous</a></p>
    </div>
    <script src="../JS/connexion.js"></script>
</body>
</html>
