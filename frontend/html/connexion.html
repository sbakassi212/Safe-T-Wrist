<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Projet BTS </title>
    <link rel="stylesheet" href="../css/connection.css">
</head>
<body>
    <div class="login-container">
        <h2>Connexion</h2>      
        <form onsubmit="login(event)"> 
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Safe-t-wrist@gmail.com" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="********" required>

            <p id="message"></p> 

            <button type="submit" class="btn-connexion">Entrer dans le stade</button>
        </form>
        <p class="register-link">Pas encore inscrit ? <a href="inscription.html">Crée ton compte</a></p>
    </div>

    <script src="../js/connexion.js"></script>
</body>
</html>
