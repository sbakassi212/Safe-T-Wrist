<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe-T-Wrist</title>
    <link rel="stylesheet" href="../css/inscription.css"> 
</head>
<body>
    <div class="login-container">
        <h2>Créer ton compte </h2>
        
        <form onsubmit="register(event)">
            <label for="nom">Nom</label>
            <input type="text" id="nom" placeholder="Ton nom" required>

            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" placeholder="Ton prénom" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="safe-t-wrist@gmail.com" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="********" required>

            <label for="confirmPassword">Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword" placeholder="********" required>

            <button type="submit">S'inscrire et Jouer</button>
        </form>
        
        <p id="message"></p> 

        <p class="register-link">Déjà membre ? <a href="connexion.html">Connecte-toi ici</a></p>
    </div>

    <script src="../js/inscription.js"></script>
</body>
</html>
