<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../html/css/inscription.css"> </head>
<body>
    <div class="login-container">
        <h2>Créer un compte</h2>
        <form action="#" method="POST">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>

        <label for="surname">Prénom</label>
        <input type="text" id="surname" name="surname" placeholder="Votre prénom" required>


            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="********" required>

            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required>

           <a href="../html/connection.html">
  <button type="submit">S'inscrire</button>
</a>
        </form>
        <p class="register-link">Déjà un compte ? <a href="../html/connection.html">Connectez-vous</a></p>
    </div>
</body>
</html>
